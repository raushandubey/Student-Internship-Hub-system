services:
  # Laravel Web Application
  - type: web
    name: student-internship-hub
    runtime: native
    plan: free
    region: oregon

    buildCommand: |
      composer install --no-dev --optimize-autoloader --no-interaction
      npm install
      npm run build
      chmod -R 775 storage bootstrap/cache
      php artisan config:clear
      php artisan route:clear
      php artisan view:clear
      php artisan storage:link

    startCommand: |
      php artisan migrate --force
      php artisan optimize
      php artisan serve --host=0.0.0.0 --port=$PORT

    envVars:
      - key: APP_NAME
        value: Student Internship Hub
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: student-internship-hub
          property: host

      # Database (PostgreSQL - Free)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: sih-database
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sih-database
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: sih-database
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sih-database
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sih-database
          property: password

      # Session & Cache
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local

      # Logging
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      # Mail (Log mode for now - free)
      - key: MAIL_MAILER
        value: log

      # PHP Config
      - key: PHP_VERSION
        value: "8.2"

      # OpenAI (Add your key manually in Render Dashboard)
      - key: OPENAI_API_KEY
        value: ADD_YOUR_KEY_HERE

databases:
  # Free PostgreSQL Database
  - name: sih-database
    plan: free
    region: oregon
    databaseName: sih_db
    user: sih_user
